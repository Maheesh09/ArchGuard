# Load a local .env file (same one docker compose uses) if present.
# Real environment variables still take precedence.
spring.config.import=optional:file:.env[.properties]

# Web Server Port
server.port=8080
# Errors are returned as RFC 7807 problem details; "detail" says e.g. why a repository URL was rejected
spring.mvc.problemdetails.enabled=true

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# A message whose listener throws is dropped instead of being redelivered forever
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:archguard}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

logging.level.com.archguard=INFO

# GitHub Authentication (optional). When blank, PR reporting is skipped.
github.api.token=${GITHUB_API_TOKEN:}

# Python sidecar. A relative script path is resolved against the working directory.
# executable defaults to "python" on Windows and "python3" elsewhere.
archguard.sidecar.python.executable=${ARCHGUARD_PYTHON:}
archguard.sidecar.python.script=${ARCHGUARD_SIDECAR_SCRIPT:sidecars/python/parser.py}
archguard.sidecar.timeout-seconds=30
